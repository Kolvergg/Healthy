<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HealthOS" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <title>HealthOS</title>
    <script>
      // Set theme before first paint to avoid a flash.
      try {
        var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = m ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body data-tab="today">
    <div id="glow" aria-hidden="true"></div>
    <div id="topbar"><button class="glass-btn off" data-act="back" aria-label="Back"></button><span class="tb-title"></span><span></span></div>
    <main id="view"></main>
    <div id="dock"><nav id="tabs" aria-label="Sections"></nav><button id="fab" data-act="fab" aria-label="Quick add"></button></div>
    <noscript>HealthOS needs JavaScript.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
